<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JonSite — a whimsical flying dream adventure built with Three.js"
    />
    <title>JonSite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <div class="brand">JonSite</div>
      <h1>Dream Flight</h1>
      <p>Drift through clouds, airships, floating islands, stars, and lucid dream magic.</p>
      <div class="controls">
        <span>WASD</span> drift
        <span>Mouse</span> look
        <span>Space</span> rise
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
